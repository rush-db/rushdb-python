[project]
name = "rushdb"
version = "3.0.0"
description = "RushDB Python SDK — memory layer for AI agents and modern apps"
authors = [
    {name = "RushDB Team", email = "hi@rushdb.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "rushdb",
    "database",
    "graph database",
    "graph-database",
    "ai memory",
    "ai-memory",
    "agent memory",
    "agent-memory",
    "memory layer",
    "memory-layer",
    "ai agents",
    "ai-agents",
    "llm memory",
    "llm-memory",
    "mcp",
    "vector search",
    "vector-search",
    "rag",
    "retrieval augmented generation",
    "embedding",
    "embeddings",
    "knowledge graph",
    "knowledge-graph",
    "json normalization",
    "json-normalization",
    "schema-less",
    "schemaless",
    "no-schema",
    "self-hosted",
    "cloud",
    "rest api",
    "rest-api",
    "graph",
    "relationships",
    "persistence",
    "rush-db",
    "rush db"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rush-db/rushdb-python"
Repository = "https://github.com/rush-db/rushdb-python"
Documentation = "https://docs.rushdb.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rushdb"]

[tool.ruff]
line-length = 120

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.12.1,<0.13",
    "types-python-dateutil>=2.9.0.20241206",
]
