[project]
name = "rushdb"
version = "2.3.0"
description = "RushDB Python SDK — memory layer for AI agents and modern apps"
authors = [
    {name = "RushDB Team", email = "hi@rushdb.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "rushdb",
    "database",
    "graph database",
    "graph-database",
    "ai memory",
    "ai-memory",
    "agent memory",
    "agent-memory",
    "memory layer",
    "memory-layer",
    "ai agents",
    "ai-agents",
    "llm memory",
    "llm-memory",
    "mcp",
    "vector search",
    "vector-search",
    "rag",
    "retrieval augmented generation",
    "embedding",
    "embeddings",
    "knowledge graph",
    "knowledge-graph",
    "json normalization",
    "json-normalization",
    "schema-less",
    "schemaless",
    "no-schema",
    "self-hosted",
    "cloud",
    "rest api",
    "rest-api",
    "graph",
    "relationships",
    "persistence",
    "rush-db",
    "rush db"
]
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/rush-db/rushdb-python"
Repository = "https://github.com/rush-db/rushdb-python"
Documentation = "https://docs.rushdb.com"

[project.optional-dependencies]
dev = [
    "black>=23.7.0",
    "isort>=5.12.0",
    "ruff>=0.0.280",
    "mypy>=1.4.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-requests>=2.31.0.1",
    "types-python-dateutil>=2.8.19.14"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rushdb"]

[tool.ruff]
line-length = 120

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.1",
    "types-python-dateutil>=2.9.0.20241206",
    "types-requests>=2.32.0.20241016",
]
